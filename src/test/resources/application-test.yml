# Test profile: isolated in-memory database and short stage timeout.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

workflow:
  # Enforced from Phase 6. Generous so real executors never time out on a cold JVM; the reliability tests
  # that exercise timeouts shorten it themselves (workflow.stage-timeout=300ms).
  stage-timeout: 2s
